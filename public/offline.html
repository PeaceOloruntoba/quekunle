<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  /><meta name="theme-color" content="#287a50" /><title>
    TwoFolds · Offline</title
  ><style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f5f9f3;
      color: #244b34;
      font:
        16px system-ui,
        sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    main {
      max-width: 360px;
      padding: 32px;
      border: 1px solid #dfebdd;
      border-radius: 24px;
      background: white;
      box-shadow: 0 16px 50px #244b3410;
    }
    h1 {
      font:
        500 30px Georgia,
        serif;
      margin: 12px 0;
    }
    p {
      line-height: 1.6;
      color: #718477;
    }
    a {
      display: inline-block;
      margin-top: 10px;
      padding: 11px 17px;
      border-radius: 99px;
      background: #287a50;
      color: white;
      text-decoration: none;
    }
  </style>
  <main>
    <div aria-hidden="true">🌿💙</div>
    <h1>A little pause</h1>
    <p>
      TwoFolds needs an internet connection to reach your private messages and
      memories. Reconnect and try again.
    </p>
    <a href="/chat">Try again</a>
  </main>
</html>
